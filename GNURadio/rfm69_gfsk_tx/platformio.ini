; Pico 2 (RP2350) + RFM69HCW continuous GFSK transmitter.
; Uses the Arduino-Pico core a fork of the arduino core which bundles the Pico software dev kit
[platformio]
default_envs = pico2
[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git

board = rpipico2
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_flags =
    -std=gnu++17

